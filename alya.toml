[package]
name = "http"
version = "0.2.0"
alya-version = "0.0.19"
entry = "src/lib.alya"
description = "Production-ready HTTP and WebSocket client, server, router, reactive event loop, and middleware toolkit for Alya"
authors = ["Alya Language Contributors <https://github.com/alya-lang>"]
license = "MIT"
homepage = "https://github.com/alya-lang/alya"
repository = "https://github.com/alya-lang/http"
keywords = ["alya", "alya-lang", "package", "http", "https", "server", "client", "router", "middleware", "compression", "brotli", "gzip", "deflate", "zstd", "websocket", "reactive", "networking", "rest-api"]

[dependencies]
compress = { git = "https://github.com/alya-lang/compress", tag = "v0.1.0", optional = true }
crypto = { git = "https://github.com/alya-lang/crypto", tag = "v0.1.0" }
event = { git = "https://github.com/alya-lang/event", tag = "v0.1.0", optional = true }
json = { git = "https://github.com/alya-lang/json", tag = "v0.2.0", optional = true }
mime = { git = "https://github.com/alya-lang/mime", tag = "v0.1.0", optional = true }
mustache = { git = "https://github.com/alya-lang/mustache", tag = "v0.1.0", optional = true }
url = { git = "https://github.com/alya-lang/url", tag = "v0.1.0" }
tls = { git = "https://github.com/alya-lang/tls", tag = "v0.1.0" }

# [lint]
# disabled_rules = []
# exclude = []

# [fmt]
# exclude = []

# [test]
# exclude = []

# [bench]
# exclude = []

[features]
default = ["compress", "event", "mime", "json", "mustache"]
compress = ["compress"]
event = ["event"]
mime = ["mime"]
json = ["json"]
mustache = ["mustache"]
