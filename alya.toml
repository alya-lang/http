[package]
name = "http"
version = "0.2.0"
alya-version = "0.0.9"
entry = "src/lib.alya"
description = "Production-ready HTTP client, server, router, and middleware toolkit for Alya"
authors = ["Alya Language Contributors <https://github.com/alya-lang>"]
license = "MIT"
homepage = "https://github.com/alya-lang/alya"
repository = "https://github.com/alya-lang/http"
keywords = ["alya", "alya-lang", "package", "http", "https", "server", "client", "router", "middleware", "networking", "rest-api"]

[dependencies]
url = { git = "https://github.com/alya-lang/url", tag = "v0.2.0" }
mime = { git = "https://github.com/alya-lang/mime", tag = "v0.2.0" }
