[package]
name = "http"
version = "0.5.0"
alya-version = "0.0.17"
entry = "src/lib.alya"
description = "Production-ready HTTP client, server, router, compression, and middleware toolkit for Alya"
authors = ["Alya Language Contributors <https://github.com/alya-lang>"]
license = "MIT"
homepage = "https://github.com/alya-lang/alya"
repository = "https://github.com/alya-lang/http"
keywords = ["alya", "alya-lang", "package", "http", "https", "server", "client", "router", "middleware", "compression", "brotli", "gzip", "deflate", "zstd", "networking", "rest-api"]

[dependencies]
compress = { git = "https://github.com/alya-lang/compress", tag = "v0.5.0" }
mime = { git = "https://github.com/alya-lang/mime", tag = "v0.4.0" }
url = { git = "https://github.com/alya-lang/url", tag = "v0.4.0" }
